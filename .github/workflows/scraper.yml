name: Naver Feed Auto Collector

on:
  schedule:
    # 2시간마다 실행 (UTC 기준)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install pandas playwright
          playwright install chromium

      - name: 크롤러 실행
        run: python collector.py
        
      - name: 결과 파일 저장소에 자동 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add naver_titles.csv prompt_result.txt || exit 0
          git commit -m "chore: update titles and prompt [skip ci]" || exit 0
          git push
